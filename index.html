<title>Table Roll Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* HRM Hydraulic house style · Table Roll Management
   Layout: floating glass top nav · full-bleed 3D over ambient ground · draggable glass bottom sheet · other pages as glass cards */
:root{
  --bg:#E9EDF4;
  --amb1:rgba(88,140,255,.30); --amb2:rgba(40,190,170,.20); --amb3:rgba(255,184,76,.22); --amb4:rgba(150,120,255,.14);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.74); --glass-card:rgba(255,255,255,.65);
  --glass-border:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.9); --glass-edge:rgba(30,50,90,.08);
  --card:rgba(255,255,255,.80); --surface:#FFFFFF; --surface-2:rgba(236,240,247,.85); --line:#DCE2EB; --grid:#E1E6EE;
  --fg:#111722; --fg-2:#535D6D; --fg-3:#828B9A;
  --primary:#2862E6; --primary-soft:rgba(40,98,230,.12); --on-primary:#FFFFFF;
  --run:#138D4C; --run-soft:rgba(19,141,76,.12);
  --stop:#657083; --stop-soft:rgba(101,112,131,.13);
  --leak:#D0353C; --leak-soft:rgba(208,53,60,.11);
  --abn:#D5600C;  --abn-soft:rgba(213,96,12,.12);
  --refill:#0B8B70; --drain:#2F74E8; --low:#B07800; --maint:#6F4FE0; --adj:#4A6488;
  --toast-bg:rgba(24,30,42,.9); --toast-fg:#FFFFFF; --toast-en:#B3BCCB;
  --shadow:0 1px 1px rgba(18,28,48,.04),0 12px 32px rgba(18,28,48,.07);
  --shadow-up:0 24px 60px rgba(18,28,48,.22); --scrim:rgba(18,26,42,.28);
  --font:"Noto Sans Thai Looped","Thonburi","Noto Sans Thai","Leelawadee UI","Sukhumvit Set",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r-xl:28px; --r-l:24px; --r-m:20px; --r-s:16px;
  --ease:cubic-bezier(.22,.9,.24,1); --gap:12px;
  --tile-mix:#FFFFFF;
  /* 3D scene */
  --floor:#C5CFDC; --floor-grid:#AEBACA; --steel:#9AA4AF; --steel-dark:#5E6873; --frame:#3C4652; --motor:#3A5F86; --housing:#3D6DB6; --housing-lo:#E8EDF2; --hl:#FFD43B;
  /* severity scale = house status colours (user spec: L1 red · L2 orange · L3 yellow · L4 blue · L5 green) */
  --l1:var(--leak); --l2:var(--abn); --l3:#E0A700; /* brighter than --low so Medium reads yellow on steel */ --l4:var(--drain); --l5:var(--run); --ni:var(--stop);
  /* aliases used by the app modules */
  --fg2:var(--fg-2); --fg3:var(--fg-3); --accent:var(--primary); --accent-ink:var(--on-primary); --accent-soft:var(--primary-soft); --line-2:#C9D2DC; --scene:var(--bg);
  --nav-h:64px; --nav-top:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F16; --amb1:rgba(70,110,255,.22); --amb2:rgba(30,170,150,.13); --amb3:rgba(255,160,60,.10); --amb4:rgba(140,100,255,.12);
  --glass:rgba(28,34,46,.52); --glass-strong:rgba(26,32,44,.76); --glass-card:rgba(24,30,40,.62); --glass-border:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.14);
  --card:rgba(24,29,39,.78); --surface:#171C25; --surface-2:rgba(40,47,60,.7); --line:#2C3441; --grid:#262E3A;
  --fg:#EEF1F6; --fg-2:#A9B2C0; --fg-3:#7F8898; --primary:#7EA5FF; --primary-soft:rgba(126,165,255,.16); --on-primary:#0B0F16;
  --run:#4CCB86; --stop:#9EA7B5; --leak:#FF7478; --abn:#FF9E55; --refill:#3FCCA8; --drain:#7EA9FF; --low:#EDB93A; --maint:#A98FFF;
  --toast-bg:rgba(236,240,246,.92); --toast-fg:#111722; --toast-en:#535D6D; --tile-mix:#1C222C; --line-2:#3A4352;
  --floor:#161C26; --floor-grid:#252E3B; --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0; --housing:#3A66A8; --housing-lo:#9AA5B1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F16; --amb1:rgba(70,110,255,.22); --amb2:rgba(30,170,150,.13); --amb3:rgba(255,160,60,.10); --amb4:rgba(140,100,255,.12);
  --glass:rgba(28,34,46,.52); --glass-strong:rgba(26,32,44,.76); --glass-card:rgba(24,30,40,.62); --glass-border:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.14);
  --card:rgba(24,29,39,.78); --surface:#171C25; --surface-2:rgba(40,47,60,.7); --line:#2C3441; --grid:#262E3A;
  --fg:#EEF1F6; --fg-2:#A9B2C0; --fg-3:#7F8898; --primary:#7EA5FF; --primary-soft:rgba(126,165,255,.16); --on-primary:#0B0F16;
  --run:#4CCB86; --stop:#9EA7B5; --leak:#FF7478; --abn:#FF9E55; --refill:#3FCCA8; --drain:#7EA9FF; --low:#EDB93A; --maint:#A98FFF;
  --toast-bg:rgba(236,240,246,.92); --toast-fg:#111722; --toast-en:#535D6D; --tile-mix:#1C222C; --line-2:#3A4352;
  --floor:#161C26; --floor-grid:#252E3B; --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0; --housing:#3A66A8; --housing-lo:#9AA5B1;
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 55% at 8% 0%,var(--amb1),transparent 70%),
  radial-gradient(55% 50% at 100% 4%,var(--amb2),transparent 70%),
  radial-gradient(60% 55% at 100% 100%,var(--amb3),transparent 70%),
  radial-gradient(55% 50% at 0% 100%,var(--amb4),transparent 70%),
  linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.tile{flex:none;display:block}
.bi{display:inline-flex;flex-direction:column;line-height:1.25;min-width:0}
.bi .en{font-size:max(12px,.72em);color:var(--fg-2);font-weight:400}
.bi.row{flex-direction:row;gap:8px;align-items:baseline}
.glass{background:var(--glass-card);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px rgba(255,255,255,.06),0 12px 40px rgba(20,30,60,.07)}

/* ---------- top nav (floating glass header) ---------- */
.nav{position:fixed;z-index:20;top:calc(var(--nav-top) + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));height:var(--nav-h);border-radius:22px;display:flex;align-items:center;gap:12px;padding:0 12px 0 12px}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;padding-right:8px}
.brand .bi .th{font-weight:700;font-size:16px}
.navlinks{position:relative;display:flex;align-items:center;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:8px 0}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{position:relative;z-index:1;display:flex;align-items:center;height:48px;padding:0 16px;border-radius:16px;color:var(--fg-2);text-decoration:none;white-space:nowrap;transition:color .25s var(--ease)}
.navlinks a .th{font-size:14.5px;font-weight:600}
.navlinks a .en{font-size:12px}
.navlinks a:hover{color:var(--fg)}
.navlinks a[aria-current="page"]{color:var(--primary)}
.navlinks a[aria-current="page"] .en{color:var(--primary);opacity:.75}
.navlinks .ind{position:absolute;z-index:0;top:8px;height:48px;border-radius:16px;background:var(--glass-strong);box-shadow:0 2px 10px rgba(20,40,90,.12);transition:transform .42s var(--ease),width .42s var(--ease);pointer-events:none}
.demo-badge{font-size:13px;font-weight:600;color:var(--abn);background:var(--abn-soft);border-radius:999px;padding:8px 12px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.demo-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--abn);box-shadow:0 0 0 4px color-mix(in srgb,var(--abn) 18%,transparent)}

/* ---------- pages ---------- */
.pages{position:fixed;inset:0;z-index:1}
.page{position:absolute;inset:0;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .36s var(--ease),transform .36s var(--ease);visibility:hidden}
.page.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.page.solid{top:calc(var(--nav-h) + var(--nav-top) + env(safe-area-inset-top,0px));overflow:auto;scrollbar-gutter:stable}
.pagewrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:4px 8px}
.ph h1{font-size:25px;font-weight:700;margin:0;line-height:1.25;text-wrap:balance;display:flex;flex-direction:column}
.ph h1 .en{font-size:14px;font-weight:400;color:var(--fg-2)}
.ph p{margin:8px 0 0;color:var(--fg-2);max-width:72ch;font-size:15px}
.card{position:relative;border-radius:var(--r-xl);padding:24px;background:var(--glass-card);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(20,30,60,.07)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
.card>*{position:relative}
.card h2{font-size:19px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols>*{min-width:0}
@media (max-width:1280px){.cols{grid-template-columns:1fr}}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;z-index:0;isolation:isolate}
#stage canvas{display:block;outline:none;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{font-size:12.5px;font-weight:600;color:var(--fg);background:var(--glass-strong);backdrop-filter:blur(10px);border:1px solid var(--glass-line);padding:4px 12px 4px 8px;border-radius:12px;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(20,30,60,.10)}
.lbl i{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center}
.lbl.minor{font-weight:500;font-size:12px;color:var(--fg-2);padding:4px 12px}
.lbl.call{background:var(--surface);border:1.5px solid var(--housing);border-radius:999px;padding:4px 12px}
.lbl.rn{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;color:var(--fg-2);gap:4px;box-shadow:none}
.lbl.rn b{width:7px;height:7px;border-radius:2px;background:var(--c)}
.lbl.sel{background:var(--fg);color:var(--bg);border-color:transparent;font-size:12.5px;padding:4px 8px}
.labels-off .lbl.rn:not(.sel){display:none}

.float{position:absolute;z-index:5;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-line);border-radius:var(--r-m);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(20,30,60,.10)}
.find{left:max(12px,env(safe-area-inset-left,0px));top:calc(var(--nav-h) + var(--nav-top) + 12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;padding:4px 4px 4px 16px;width:min(380px,calc(100% - 24px));border-radius:999px;transition:width .34s var(--ease),box-shadow .25s}
.find:focus-within{width:min(460px,calc(100% - 24px));box-shadow:0 0 0 4px var(--primary-soft),0 12px 40px rgba(20,30,60,.12)}
.find input{flex:1;min-width:0;height:48px;border:0;background:transparent;outline:none;font-family:var(--mono);font-size:16px}
.find input::placeholder{font-family:var(--font);color:var(--fg-3);font-size:15px}
.find .go{height:48px;padding:0 20px;border-radius:999px;border:0;color:var(--on-primary);font-weight:600;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 88%,#fff),var(--primary));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px color-mix(in srgb,var(--primary) 32%,transparent)}
.find-hint{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--glass-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-line);border-radius:var(--r-m);box-shadow:var(--shadow-up);padding:8px;display:flex;flex-direction:column}
.find-hint button{display:flex;align-items:center;gap:12px;min-height:50px;border:0;background:transparent;border-radius:14px;padding:0 12px;text-align:left}
.find-hint button:hover,.find-hint button.act{background:var(--surface-2)}
.find-hint .empty{padding:12px;color:var(--fg-2);font-size:14px}
.legend{right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--nav-h) + var(--nav-top) + 12px + env(safe-area-inset-top,0px));display:flex;gap:2px;padding:4px;border-radius:999px}
.legend button{height:44px;min-width:44px;border:0;background:transparent;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 12px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums;transition:background .2s}
.legend button:hover{background:var(--surface-2)}
.legend button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 10px rgba(20,40,90,.12);color:var(--fg)}
.legend .sw{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.legend .sw.ni{background:repeating-linear-gradient(135deg,var(--ni) 0 2px,transparent 2px 4px);border:1.5px solid var(--ni);box-shadow:none;border-radius:3px}
.camctl{right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:26px;transition:bottom .38s var(--ease),opacity .25s}
.camctl.off{opacity:0;pointer-events:none}
.camctl button{width:48px;height:48px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--fg-2)}
.camctl button:hover{background:var(--surface-2);color:var(--fg)}
.camctl button:active{transform:scale(.94)}
.camctl button[aria-pressed="true"]{color:var(--primary);background:var(--primary-soft)}
.camctl hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.tipbox{position:fixed;z-index:40;pointer-events:none;background:var(--toast-bg);color:var(--toast-fg);font-size:13px;padding:8px 12px;border-radius:12px;transform:translate(14px,14px);white-space:nowrap;display:flex;gap:8px;align-items:center;backdrop-filter:blur(12px)}

/* ---------- bottom sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;pointer-events:none}
.sheet .body{position:relative;pointer-events:auto;width:min(100%,1320px);margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));background:var(--glass-strong);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--glass-line);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:inset 0 1px 0 var(--glass-hi),0 -12px 48px rgba(18,28,48,.16);display:flex;flex-direction:column;height:var(--sh,380px);transition:height .4s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.dragging .body{transition:none}
.grab{height:24px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.grab i{width:48px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.45}
.sheet-top{display:flex;align-items:center;gap:12px;padding:0 16px 12px;flex:none;touch-action:none}
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface-2);gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{height:48px;padding:0 16px;border:0;background:transparent;border-radius:999px;color:var(--fg-2);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .25s var(--ease),color .25s}
.tabs button .th{font-size:15px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:0 2px 10px rgba(20,40,90,.12)}
.tabs button[aria-selected="true"] .en{color:var(--primary);opacity:.75}
.tabs button .cnt{font-family:var(--mono);font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2)}
.tabs button .cnt:empty{display:none}
.tabs button:disabled{opacity:.4;cursor:default}
.sheet-top .sp{flex:1}
.iconbtn{width:48px;height:48px;border:0;background:var(--surface-2);border-radius:999px;display:grid;place-items:center;color:var(--fg-2);flex:none;transition:background .2s}
.iconbtn:hover{color:var(--fg);background:var(--glass-strong)}
.iconbtn:active{transform:scale(.95)}
.iconbtn:disabled{opacity:.35;cursor:default}
.sheet-content{flex:1;min-height:0;overflow:auto;padding:2px 16px 16px;overscroll-behavior:contain;scrollbar-gutter:stable}
.tabpane{animation:fadeup .34s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* zone cards */
.zones{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.zones{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zc{border:2px solid transparent;background:var(--surface-2);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:background .2s,border-color .2s,transform .12s}
.zc:hover{background:var(--glass-strong)}
.zc:active{transform:scale(.98)}
.zc[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.zc .t{display:flex;align-items:center;gap:12px}
.ztag{width:40px;height:40px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.zc .nm{font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.zc .nm small{display:block;font-weight:400;color:var(--fg-2);font-size:13px}
.zc .nm small b{font-family:var(--mono);font-weight:700;color:var(--fg);font-size:14px}
.sbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line);gap:1.5px}
.sbar b{display:block;border-radius:2px;transition:flex-grow .6s var(--ease)}
.lvrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,2.2fr);gap:2px;font-family:var(--mono);font-size:14px;text-align:center}
.lvrow span{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--fg-2)}
.lvrow span em{font-style:normal;font-size:12px;color:var(--fg-3);white-space:nowrap;font-family:var(--font)}
.lvrow span b{font-weight:700;color:var(--fg)}
.lvrow span b.z{color:var(--fg-3);font-weight:400}

/* severity badge */
.sev{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;padding:0 8px;background:var(--c);transition:background .3s;font-variant-numeric:tabular-nums}
.sev.l3{color:#2A2000}
.sev.ni{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--surface-2) 4px 8px);color:var(--fg-2);border:1.5px solid var(--ni);font-weight:500}
.sev.big{height:56px;min-width:56px;border-radius:16px;font-size:26px;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.sev.big.ni{box-shadow:none}
.sevname{font-size:14px;color:var(--fg-2);font-weight:400}

/* roll selector */
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.selbar .search{display:flex;align-items:center;gap:8px;height:48px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:0 16px;flex:1 1 220px;min-width:170px;transition:border-color .2s}
.selbar .search:focus-within{border-color:var(--primary)}
.selbar .search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;font-family:var(--mono)}
.selbar .search input::placeholder{font-family:var(--font);color:var(--fg-3)}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:0;background:var(--surface-2);color:var(--fg-2);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .2s,color .2s}
.fbtn:hover{background:var(--glass-strong);color:var(--fg)}
.fbtn:active{transform:scale(.97)}
.fbtn[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--primary) 45%,transparent)}
.fbtn .sw{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.fbtn .sw.ni{background:repeating-linear-gradient(135deg,var(--ni) 0 2px,transparent 2px 4px);border:1.5px solid var(--ni);box-shadow:none;border-radius:3px}
.fbtn.lvl{font-family:var(--mono);font-weight:700;padding:0 12px}
select.fsel{height:48px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--surface);padding:0 12px;color:var(--fg)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface-2);gap:2px}
.seg button{height:44px;padding:0 16px;border:0;background:transparent;border-radius:999px;color:var(--fg-2);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:0 2px 10px rgba(20,40,90,.12)}
.seg button:disabled{opacity:.45;cursor:default}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.rchip{height:64px;border-radius:var(--r-s);border:2px solid transparent;background:var(--surface-2);display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left;transition:background .2s,border-color .2s,transform .1s}
.rchip:hover{background:var(--glass-strong)}
.rchip:active{transform:scale(.97)}
.rchip[aria-current="true"]{border-color:var(--primary);background:var(--primary-soft)}
.rchip>span:last-child{min-width:0}
.rchip .id{font-family:var(--mono);font-size:17px;font-weight:700;line-height:1.1}
.rchip .z{font-size:12px;color:var(--fg-3);display:block;font-family:var(--font);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:32px 96px 1fr auto auto;gap:12px;align-items:center;min-height:60px;border:2px solid transparent;background:var(--surface-2);text-align:left;padding:0 16px;border-radius:var(--r-s);transition:background .2s}
.rrow:hover{background:var(--glass-strong)}
.rrow[aria-current="true"]{border-color:var(--primary);background:var(--primary-soft)}
.rrow .id{font-family:var(--mono);font-weight:700;font-size:16px}
.rrow .meta{color:var(--fg-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .age{font-family:var(--mono);font-size:13px;color:var(--fg-2);text-align:right}
.tagp{font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px;background:color-mix(in srgb,var(--maint) 12%,transparent);color:var(--maint);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.pager .info{font-family:var(--mono);font-size:13px;color:var(--fg-2)}
.pager .pg{display:flex;gap:4px}
.pager .pg button{height:44px;min-width:44px;border-radius:999px;border:0;background:var(--surface-2);font-family:var(--mono);font-size:14px;font-weight:600}
.pager .pg button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.pager .pg button:disabled{opacity:.35;cursor:default}
.emptyst{padding:32px 16px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:var(--r-m);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 20px);border:2px dashed var(--line)}
.emptyst b{color:var(--fg);font-size:16px}

/* detail */
.det{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.det{grid-template-columns:1fr}}
.det>*{min-width:0;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;gap:16px;align-items:flex-start}
.dhead .eyebrow{font-size:13px;color:var(--fg-2);font-weight:500}
.dhead .pid{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.dhead .sub{font-size:14px;color:var(--fg-2)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts>div{background:var(--surface-2);border-radius:var(--r-s);padding:12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:13px;color:var(--fg-2)}
.facts b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts b.m{font-family:var(--mono)}
.facts b small{font-size:.7em;font-weight:400;color:var(--fg-2);margin-left:4px}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.acts button{min-height:96px;border-radius:var(--r-m);border:2px solid transparent;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--fg);padding:8px 4px;line-height:1.2;text-align:center;transition:background .2s,border-color .2s,transform .1s}
.acts button .th{font-size:14px;font-weight:600}
.acts button .en{font-size:12px}
.acts button:hover{background:var(--glass-strong)}
.acts button:active{transform:scale(.97)}
.acts button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
@media (max-width:520px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-size:15px;color:var(--fg);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sect h3 .en{text-transform:none;letter-spacing:0;color:var(--fg-3);font-weight:400;margin-left:8px}
.hist{display:flex;gap:4px;align-items:flex-end;height:48px;padding-top:4px}
.hist i{flex:1;max-width:24px;border-radius:5px 5px 2px 2px;background:var(--c)}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-s);background:var(--surface-2);font-size:14px;min-height:52px}
.rec .d{font-family:var(--mono);font-size:13px;color:var(--fg-2)}
.rec .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rec .t small{color:var(--fg-2)}
.none{font-size:14px;color:var(--fg-2);padding:12px 16px;border:2px dashed var(--line);border-radius:var(--r-s);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 20px)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.spec dt{color:var(--fg-2)}
.spec dd{margin:0;text-align:right;font-family:var(--mono);font-size:13px}
details.more summary{cursor:pointer;color:var(--fg-2);font-size:14px;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s var(--ease)}
details.more[open] summary::before{transform:rotate(45deg)}
.warn{font-size:13.5px;line-height:1.5;padding:12px 16px;border-radius:var(--r-s);background:var(--abn-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--abn) 40%,transparent)}

/* forms */
.form{border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--primary),0 12px 32px rgba(18,28,48,.08);animation:fadeup .34s var(--ease)}
.form h4{margin:0;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;color:var(--fg-2);font-weight:600}
.field input,.field select,.field textarea{height:56px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--surface);padding:0 16px;outline:none;font-size:16px}
.field textarea{height:84px;padding:12px 16px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.frow{grid-template-columns:1fr}}
.lvpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvpick button{height:72px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:border-color .2s,background .2s,transform .1s}
.lvpick button b{font-family:var(--mono);font-size:24px;line-height:1;color:var(--c)}
.lvpick button small{font-size:12px;color:var(--fg-2)}
.lvpick button:active{transform:scale(.96)}
.lvpick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.fbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:60px;padding:0 24px;border-radius:999px;border:0;background:var(--surface-2);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap;transition:background .2s,transform .1s}
.btn:hover{background:var(--glass-strong)}
.btn:active{transform:scale(.97)}
.btn.pri{color:var(--on-primary);background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 88%,#fff),var(--primary));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px color-mix(in srgb,var(--primary) 32%,transparent)}
.btn.pri:disabled{opacity:.45;cursor:default}
.btn.tonal{background:var(--primary-soft);color:var(--primary)}
.btn.danger{color:var(--leak);background:var(--leak-soft)}
.btn.sm{height:44px;padding:0 16px;font-size:14px}
.err{color:var(--leak);font-size:14px;font-weight:600}

/* page widgets */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{position:relative;border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--glass-card);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(20,30,60,.07);transition:background .2s,transform .12s}
.kpi:hover{background:var(--glass-strong)}
.kpi:active{transform:scale(.98)}
.kpi>span{display:flex;align-items:center;gap:12px}
.kpi>span .th{font-size:15px;font-weight:600}
.kpi b{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.38em;font-weight:500;color:var(--fg-2);letter-spacing:0;margin-left:8px;font-family:var(--font)}
.kpi>small{font-size:13px;color:var(--fg-2)}
.kpi.alert{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--leak) 42%,transparent),0 12px 40px rgba(20,30,60,.07)}
.kpi.alert::after{content:"";position:absolute;top:18px;right:18px;width:11px;height:11px;border-radius:50%;background:var(--leak);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leak) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.grows{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;gap:12px;align-items:center;min-height:68px;padding:12px 16px;border-radius:var(--r-m);background:var(--surface-2);transition:background .2s}
.grow:hover{background:var(--glass-strong)}
.grow .id{font-family:var(--mono);font-weight:700;font-size:18px}
.grow .s{font-size:13px;color:var(--fg-2)}
.grow .cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead{display:grid;gap:12px;padding:0 16px 4px;font-size:13px;font-weight:600;color:var(--fg-2)}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:600;padding:0 12px;border-radius:999px;min-height:44px;white-space:nowrap}
.linkbtn:hover{background:var(--primary-soft)}
.tl{display:flex;flex-direction:column;gap:2px}
.tli{display:grid;grid-template-columns:112px 40px 1fr;gap:12px;padding:12px 4px;align-items:center;border-bottom:1px solid var(--line)}
.tli:last-child{border-bottom:0}
.tli .d{font-family:var(--mono);font-size:13px;color:var(--fg-2)}
.tli .x{font-size:15px;min-width:0}
.tli .x small{display:block;color:var(--fg-2);font-size:13px}
.status{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.st-open{color:var(--leak);background:var(--leak-soft)}
.st-closed{color:var(--stop);background:var(--stop-soft)}
.st-planned{color:var(--maint);background:color-mix(in srgb,var(--maint) 12%,transparent)}
.st-approved{color:var(--run);background:var(--run-soft)}
.st-low{color:var(--abn);background:var(--abn-soft)}
.st-ok{color:var(--run);background:var(--run-soft)}
.chart text{fill:var(--fg-2);font-family:var(--mono);font-size:12px}
.chart .gl{stroke:var(--grid);stroke-width:1.2}
.inpnum{width:96px;height:48px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--surface);text-align:right;padding:0 12px;font-family:var(--mono);font-size:16px;font-weight:600}
.inpnum:focus{border-color:var(--primary);outline:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tblwrap{overflow-x:auto;margin:-8px -6px -8px;padding:0 8px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:15px}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--fg-2);padding:4px 16px 0;white-space:nowrap;position:sticky;top:0;background:linear-gradient(var(--card) 70%,transparent);z-index:1}
.tbl td{padding:12px 16px;background:var(--surface-2);vertical-align:middle;height:64px;transition:background .2s}
.tbl td:first-child{border-radius:var(--r-m) 0 0 var(--r-m)}
.tbl td:last-child{border-radius:0 var(--r-m) var(--r-m) 0}
.tbl tbody tr:hover td{background:var(--glass-strong)}
.tbl .num{text-align:right;font-family:var(--mono)}
.tbl td.mono b{font-size:17px}
/* ---------- dashboard: thin stat strip → main list (≈70%) + narrow rail ---------- */
.kstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:var(--r-l);padding:8px}
.kcell{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 16px;border:0;background:transparent;text-align:left;border-radius:var(--r-m);min-width:0;transition:background .2s}
button.kcell:hover{background:var(--surface-2)}
button.kcell:active{transform:scale(.98)}
.kcell+.kcell::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.kcell .th{font-size:15px;font-weight:600;color:var(--fg-2)}
.kcell b{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kcell b small{font-family:var(--font);font-size:15px;font-weight:500;color:var(--fg-2);letter-spacing:0;margin-left:8px}
.kcell.alert b{color:var(--l1)}
.kcell.alert .th{color:var(--l1)}
.kcell.alert::after{content:"";position:absolute;top:16px;right:16px;width:10px;height:10px;border-radius:50%;background:var(--leak);animation:pulse 2.4s var(--ease) infinite}
.kcell.l2 b{color:var(--l2)}
.dgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(320px,3fr);gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.urow{grid-template-columns:44px 88px 56px minmax(0,1fr) minmax(0,190px) 24px}
.ghead.urow{display:grid}
button.grow{width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.grow:active{transform:scale(.995)}
.grow .chev{color:var(--fg-3);display:grid;place-items:center}
.grow:hover .chev{color:var(--fg)}
.zmini{display:flex;flex-direction:column;gap:8px}
.zrow{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:12px;align-items:center;min-height:64px;padding:8px 12px;border:0;border-radius:var(--r-m);background:var(--surface-2);text-align:left;transition:background .2s}
.zrow:hover{background:var(--glass-strong)}
.zrow:active{transform:scale(.99)}
.zm{display:flex;flex-direction:column;gap:8px;min-width:0}
.zn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc1{display:grid;place-items:center}
.tli.noic{grid-template-columns:104px minmax(0,1fr)}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tline .k{color:var(--fg-2);font-size:14px;white-space:nowrap}
.tli .x small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- readable Thai: never split short labels mid-word ---------- */
body{overflow-wrap:normal;word-break:normal;line-break:strict}
h1,h2,h3,h4{text-wrap:balance}
p{text-wrap:pretty}
button,.btn,.fbtn,.status,.tagp,.sev,.lbl,.seg button,.tabs button,.navlinks a,.linkbtn,.demo-badge,.tbl th,.tbl td,.ghead span,.facts span,.lvrow span,.sevname,.kcell .th,.kcell .en,.pager .info{white-space:nowrap}
.tbl td.wrapcell{white-space:normal;min-width:180px;max-width:320px}
.grow .cell,.facts b,.rrow .meta,.rec .t,.zn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emptyst,.emptyst b,.warn,.note,.ph p,.form .note{white-space:normal}

/* ---------- tablet (iPad 1024–1180 landscape, 768–834 portrait) ---------- */
@media (max-width:1280px){
  .dgrid{grid-template-columns:minmax(0,1fr) 320px}
  .urow{grid-template-columns:44px 80px 48px minmax(0,1fr) minmax(0,170px) 24px}
}
@media (max-width:1100px){
  .kstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kstrip .kcell:nth-child(4)::before{display:none}
  .dgrid{grid-template-columns:1fr}
  .rail{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .rail>*{min-width:0}
}
@media (max-width:860px){
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kstrip .kcell:nth-child(odd)::before{display:none}
  .kstrip .kcell:nth-child(4)::before{display:block}
  .rail{display:flex}
  .urow{grid-template-columns:44px 80px 40px minmax(0,1fr) 24px}
  .urow>:nth-child(5){display:none}
}

/* ---------- tablet nav: never cut a label mid-word ---------- */
.navlinks{scroll-snap-type:x proximity;scroll-padding-inline:8px}
.navlinks a{scroll-snap-align:start}
.navlinks.more-r{mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.navlinks.more-l.more-r{mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 56px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 56px),transparent)}
.navlinks.more-l:not(.more-r){mask-image:linear-gradient(90deg,transparent,#000 40px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px)}
@media (max-width:1180px){
  .brand .bi{display:none}
  .demo-badge{font-size:0;padding:8px;gap:0}
  .navlinks a{padding:0 12px}
  .navlinks a .th{font-size:15px}
}
@media (max-width:1100px){
  .kstrip{grid-template-columns:repeat(5,minmax(0,1fr));padding:4px}
  .kstrip .kcell::before{display:block!important}
  .kstrip .kcell:first-child::before{display:none!important}
  .kcell{padding:12px}
  .kcell .en{display:none}
  .kcell .th{font-size:14px}
  .kcell b{font-size:30px}
  .kcell b small{display:block;margin:2px 0 0;font-size:13px}
}
@media (max-width:640px){
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kstrip .kcell:nth-child(odd)::before{display:none!important}
  .kstrip .kcell:last-child{grid-column:span 2}
}
/* ---------- crack standard: verdict, level picker, criteria ---------- */
.vv{display:inline-grid;place-items:center;min-width:56px;height:32px;padding:0 10px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.5px;color:#fff;background:var(--c);white-space:nowrap}
.v3 .vv{color:#2A2000}
.v4 .vv,.v5 .vv{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent)}
.verdict{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--c) 9%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.verdict .vt{display:flex;align-items:center;gap:12px}
.verdict .vt .th{font-weight:700;font-size:16px}
.verdict .vd{font-size:14px;color:var(--fg-2);white-space:normal}
.verdict .vd b{color:var(--fg)}
.vwarn{margin-top:6px;color:var(--leak);font-weight:600}
.verdict.v1{animation:none}
.lvpick button{height:auto;min-height:116px;padding:10px 6px;gap:4px;justify-content:flex-start}
.lvpick .lh{display:flex;align-items:baseline;gap:6px}
.lvpick .lh em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c)}
.lvpick .ln{font-size:14px;font-weight:600;white-space:nowrap}
.lvpick button small{white-space:normal;text-align:center;line-height:1.3;font-size:12px;word-break:keep-all;overflow-wrap:normal}
.lvguide{min-height:24px}
.guide{border-radius:var(--r-m);padding:12px 16px;background:color-mix(in srgb,var(--c) 8%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;gap:12px;animation:fadeup .3s var(--ease)}
.guide .gh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.guide .gh b{font-size:16px}
.guide .gcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.guide h5{margin:0 0 4px;font-size:13px;color:var(--fg-2);font-weight:600}
.guide ul,.guide ol{margin:0;padding-left:20px;font-size:14px;line-height:1.55;white-space:normal}
.guide li{white-space:normal}
.guide.v1 .gh b{color:var(--leak)}
.crit{display:flex;flex-direction:column;gap:8px}
.crow{border-radius:var(--r-m);background:var(--surface-2)}
.crow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:32px minmax(0,1fr) 72px minmax(0,280px);gap:16px;align-items:center;min-height:64px;padding:8px 16px}
.crow summary::-webkit-details-marker{display:none}
.crow summary:hover{background:var(--glass-strong);border-radius:var(--r-m)}
.crow .cname{display:flex;flex-direction:column;min-width:0}
.crow .cname b{font-size:16px}
.crow .cname .sevname{white-space:normal}
.crow .cdl{font-size:14px;color:var(--fg-2);white-space:normal}
.crow[open]{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.crow .guide{margin:0 12px 12px;box-shadow:none}
@media (max-width:860px){.crow summary{grid-template-columns:32px minmax(0,1fr) 64px}.crow .cdl{display:none}.guide .gcols{grid-template-columns:1fr}}

/* ---------- replacement plan Gantt (2570–2571) ---------- */
.glegend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--fg-2);font-weight:400}
.glegend>span{display:inline-flex;align-items:center;gap:8px}
.gantt-wrap{margin:0}
.gantt{border-collapse:separate;border-spacing:0;font-size:14px;min-width:1180px;width:100%}
.gantt th{font-weight:600;color:var(--fg-2);font-size:13px;padding:8px 4px;white-space:nowrap;text-align:center;position:sticky;top:0;background:var(--card)}
.gantt .gy th{font-size:14px;color:var(--fg);border-bottom:1px solid var(--line)}
.gantt td{border-top:1px solid var(--line);padding:8px 4px;text-align:center;height:64px}
.gantt .gp{width:44px}
.gantt .gr{width:150px;text-align:left;padding-left:8px}
.gantt .gt{width:84px}
.gantt .gm{width:36px;min-width:36px}
.gantt .now{background:var(--primary-soft)}
.gantt .ys{border-left:2px solid var(--line)}
.gid{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:12px;padding:4px 8px 4px 4px;min-height:48px;text-align:left}
.gid:hover{background:var(--surface-2)}
.gid>span:last-child{display:flex;flex-direction:column;line-height:1.2}
.gid b{font-size:16px}
.gid .sevname{font-size:12px}
.gb{display:inline-block;width:26px;height:26px;border-radius:8px;vertical-align:middle}
.gb.plan{background:var(--primary)}
.gb.done{background:var(--run)}
.gb.part{background:linear-gradient(90deg,var(--run) 50%,var(--primary) 50%)}
.gb.late{background:repeating-linear-gradient(135deg,var(--leak) 0 4px,color-mix(in srgb,var(--leak) 55%,#fff) 4px 8px)}
.glegend .gb{width:16px;height:16px;border-radius:5px}
.kcell.l3 b{color:var(--l3)}
/* toast & loading */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--toast-bg);color:var(--toast-fg);padding:12px 20px 12px 12px;border-radius:var(--r-l);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-up);backdrop-filter:blur(16px);transform:translateX(calc(100% + 40px));transition:transform .4s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:none}
.toast .tt{font-weight:700;font-size:15px}
.toast .td{font-size:13px;color:var(--toast-en)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-2);z-index:3;transition:opacity .4s;background:var(--bg)}
.loading.done{opacity:0;pointer-events:none}
