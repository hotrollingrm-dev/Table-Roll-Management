<title>Table Roll Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-width top nav · full-bleed 3D stage · draggable bottom sheet (tabs: zones / rolls / detail) · other pages as solid panes */
:root{
  --bg:#EDF1F5; --scene:#DFE7EF; --floor:#B4C1CF; --grid:#A3B2C2;
  --surface:#FFFFFF; --surface-2:#F5F7FA; --glass:rgba(255,255,255,.90);
  --line:#DEE4EA; --line-2:#C9D2DC;
  --fg:#16202B; --fg2:#566271; --fg3:#8792A0;
  --accent:#1F6FEB; --accent-ink:#FFFFFF; --accent-soft:#E8F0FE;
  --steel:#9AA4AF; --steel-dark:#5E6873; --frame:#3C4652; --motor:#3A5F86; --housing:#3D6DB6; --housing-lo:#E8EDF2;
  --l1:#E5484D; --l2:#F76B15; --l3:#F2B600; --l4:#3E7BFA; --l5:#2F9E62; --ni:#AEB7C2; --l3-ink:#2A2000;
  --hl:#FFD43B;
  --font:"Noto Sans Thai Looped","Noto Sans Thai","Thonburi",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px; --r-sm:9px; --nav-h:60px;
  --shadow:0 10px 34px rgba(16,28,45,.12),0 1px 2px rgba(16,28,45,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --scene:#10171F; --floor:#1A222B; --grid:#26303B;
  --surface:#161C23; --surface-2:#1B222A; --glass:rgba(22,28,35,.92); --line:#27303A; --line-2:#36414D;
  --fg:#E7ECF1; --fg2:#9AA6B3; --fg3:#6C7885; --accent:#4C8DFF; --accent-soft:#1A2A44;
  --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0; --housing:#3A66A8; --housing-lo:#9AA5B1;
  --shadow:0 10px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --scene:#10171F; --floor:#1A222B; --grid:#26303B;
  --surface:#161C23; --surface-2:#1B222A; --glass:rgba(22,28,35,.92); --line:#27303A; --line-2:#36414D;
  --fg:#E7ECF1; --fg2:#9AA6B3; --fg3:#6C7885; --accent:#4C8DFF; --accent-soft:#1A2A44;
  --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0; --housing:#3A66A8; --housing-lo:#9AA5B1;
  --shadow:0 10px 34px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* ---------- top nav ---------- */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--nav-h);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap;padding-right:10px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--fg);display:grid;place-items:center}
.brand .mark svg{stroke:var(--surface);width:18px;height:18px}
.navlinks{position:relative;display:flex;align-items:stretch;height:100%;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{display:flex;align-items:center;padding:0 12px;color:var(--fg2);text-decoration:none;font-size:14px;white-space:nowrap;transition:color .2s}
.navlinks a:hover{color:var(--fg)}
.navlinks a[aria-current="page"]{color:var(--fg);font-weight:600}
.navlinks .ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transition:transform .35s var(--ease),width .35s var(--ease);pointer-events:none}
.demo-badge{font-size:12px;font-weight:600;color:#8A5A00;background:#FFF4D6;border:1px solid #F3DA94;border-radius:999px;padding:3px 10px;white-space:nowrap}
:root[data-theme="dark"] .demo-badge{background:#3A2E10;color:#F2D27A;border-color:#5A4A1E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo-badge{background:#3A2E10;color:#F2D27A;border-color:#5A4A1E}}

/* ---------- pages ---------- */
.pages{position:fixed;inset:calc(var(--nav-h) + env(safe-area-inset-top,0px)) 0 0 0}
.page{position:absolute;inset:0;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .28s var(--ease),transform .32s var(--ease);visibility:hidden}
.page.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.page.solid{background:var(--bg);overflow:auto}
.pagewrap{max-width:1240px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--fg2);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.cols>*{min-width:0}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0}
#stage canvas{display:block;outline:none;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{font-size:12px;font-weight:600;color:var(--fg);background:var(--glass);border:1px solid var(--line);padding:4px 9px;border-radius:7px;white-space:nowrap;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lbl i{font-style:normal;width:20px;height:20px;border-radius:6px;background:var(--fg);color:var(--surface);font-size:11px;display:grid;place-items:center}
.lbl.minor{font-weight:500;font-size:11.5px;color:var(--fg2)}
.lbl.call{background:var(--surface);border:1.5px solid var(--housing);font-size:12px;border-radius:5px;padding:3px 9px}
.lbl.rn{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 5px;border-radius:4px;color:var(--fg2);gap:4px}
.lbl.rn b{width:7px;height:7px;border-radius:2px;background:var(--c)}
.lbl.sel{background:var(--fg);color:var(--surface);border-color:transparent;font-size:12px;padding:3px 8px}
.labels-off .lbl.rn:not(.sel){display:none}

/* floating controls on 3D */
.float{position:absolute;z-index:5;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.find{left:max(16px,env(safe-area-inset-left,0px));top:14px;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;width:min(360px,calc(100% - 32px));transition:width .3s var(--ease),box-shadow .2s}
.find:focus-within{width:min(440px,calc(100% - 32px));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent),var(--shadow)}
.find input{flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none;font-family:var(--mono);font-size:15px}
.find input::placeholder{font-family:var(--font);color:var(--fg3);font-size:14px}
.find .go{height:44px;padding:0 16px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.find-hint{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.find-hint button{display:flex;align-items:center;gap:10px;height:44px;border:0;background:transparent;border-radius:8px;padding:0 10px;text-align:left}
.find-hint button:hover,.find-hint button.act{background:var(--surface-2)}
.find-hint .empty{padding:10px;color:var(--fg2);font-size:13px}
.legend{right:max(16px,env(safe-area-inset-right,0px));top:14px;display:flex;gap:2px;padding:5px}
.legend button{height:40px;min-width:44px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 9px;font-family:var(--mono);font-size:13px;color:var(--fg2)}
.legend button:hover{background:var(--surface-2)}
.legend button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--fg)}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .sw.ni{background:transparent;border:1.5px dashed var(--ni)}
.camctl{right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2px;padding:5px;transition:bottom .35s var(--ease),opacity .25s}
.camctl.off{opacity:0;pointer-events:none}
.camctl button{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--fg2);position:relative}
.camctl button:hover{background:var(--surface-2);color:var(--fg)}
.camctl button[aria-pressed="true"]{color:var(--accent)}
.camctl hr{border:0;border-top:1px solid var(--line);margin:2px 6px}
.tipbox{position:fixed;z-index:40;pointer-events:none;background:var(--fg);color:var(--surface);font-size:12px;padding:5px 9px;border-radius:6px;transform:translate(12px,12px);white-space:nowrap;display:flex;gap:6px;align-items:center}

/* ---------- bottom sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;pointer-events:none;transition:transform .38s var(--ease)}
.sheet .body{pointer-events:auto;width:min(100%,1240px);margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(16,28,45,.14);display:flex;flex-direction:column;height:var(--sh,380px);transition:height .38s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.dragging .body{transition:none}
.grab{height:22px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet-top{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex:none}
.tabs{display:inline-flex;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{height:44px;padding:0 16px;border:0;background:transparent;border-radius:9px;color:var(--fg2);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.tabs button .cnt{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.tabs button:disabled{opacity:.4;cursor:default}
.sheet-top .sp{flex:1}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--fg2);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.sheet-content{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;overscroll-behavior:contain}
.tabpane{animation:fadeup .28s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* zone cards */
.zones{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.zones{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:120px;transition:border-color .2s,box-shadow .2s,transform .1s}
.zc:hover{border-color:var(--line-2)}
.zc:active{transform:scale(.985)}
.zc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.zc .t{display:flex;align-items:center;gap:10px}
.ztag{width:34px;height:34px;border-radius:9px;background:var(--fg);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.zc .nm{font-size:13px;font-weight:600;line-height:1.25;min-width:0}
.zc .nm small{display:block;font-weight:400;color:var(--fg2);font-family:var(--mono);font-size:12px}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.sbar b{display:block;transition:flex-grow .5s var(--ease)}
.lvrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.9fr);gap:2px;font-family:var(--mono);font-size:11.5px;text-align:center}
.lvrow span{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--fg2)}
.lvrow span em{font-style:normal;font-size:10px;color:var(--fg3);white-space:nowrap}
.lvrow span b{font-weight:600;color:var(--fg)}
.lvrow span b.z{color:var(--fg3);font-weight:400}

/* severity badge */
.sev{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:#fff;padding:0 6px;background:var(--c);transition:background .3s}
.sev.l3{color:var(--l3-ink)}
.sev.ni{background:transparent;color:var(--fg2);border:1.5px dashed var(--ni);font-weight:500}
.sev.big{height:48px;min-width:48px;border-radius:12px;font-size:22px}
.sevname{font-size:12.5px;color:var(--fg2)}

/* roll selector */
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.selbar .search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;flex:1 1 200px;min-width:160px;transition:border-color .2s,box-shadow .2s}
.selbar .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.selbar .search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;font-family:var(--mono)}
.selbar .search input::placeholder{font-family:var(--font);color:var(--fg3)}
.fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fbtn{height:40px;min-width:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.fbtn:hover{border-color:var(--line-2);color:var(--fg)}
.fbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.fbtn .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.fbtn .sw.ni{background:transparent;border:1.5px dashed var(--ni)}
.fbtn.lvl{font-family:var(--mono);padding:0 10px}
select.fsel{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;color:var(--fg)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--fg) 6%,transparent);gap:2px}
.seg button{height:34px;padding:0 12px;border:0;background:transparent;border-radius:7px;color:var(--fg2);font-size:13px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.rchip{height:56px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;transition:border-color .15s,transform .1s,box-shadow .2s}
.rchip:hover{border-color:var(--line-2)}
.rchip:active{transform:scale(.97)}
.rchip[aria-current="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.rchip .id{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.1}
.rchip>span:last-child{min-width:0}
.rchip .z{font-size:11px;color:var(--fg3);display:block;font-family:var(--font);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip.dim{opacity:.4}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:32px 92px 1fr auto auto;gap:12px;align-items:center;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:0 6px;border-radius:0}
.rrow:hover{background:var(--surface-2)}
.rrow[aria-current="true"]{background:var(--accent-soft)}
.rrow .id{font-family:var(--mono);font-weight:600}
.rrow .meta{color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .age{font-family:var(--mono);font-size:12.5px;color:var(--fg2);text-align:right}
.tagp{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.pager .info{font-family:var(--mono);font-size:12.5px;color:var(--fg2)}
.pager .pg{display:flex;gap:4px}
.pager .pg button{height:40px;min-width:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px}
.pager .pg button[aria-current="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.pager .pg button:disabled{opacity:.35;cursor:default}
.emptyst{padding:28px 16px;text-align:center;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:10px}
.emptyst b{color:var(--fg);font-size:15px}

/* detail */
.det{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.det{grid-template-columns:1fr}}
.det>*{min-width:0;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead .eyebrow{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg3);font-weight:600}
.dhead .pid{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.05;letter-spacing:-.5px}
.dhead .sub{font-size:13px;color:var(--fg2)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts>div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:11.5px;color:var(--fg2)}
.facts b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts b.m{font-family:var(--mono);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.acts button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--fg);padding:6px 4px;line-height:1.2;text-align:center;transition:border-color .15s,transform .1s}
.acts button:hover{border-color:var(--line-2)}
.acts button:active{transform:scale(.97)}
.acts button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.acts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
@media (max-width:480px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg3);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hist{display:flex;gap:4px;align-items:flex-end;height:44px;padding-top:4px}
.hist i{flex:1;max-width:22px;border-radius:3px 3px 1px 1px;background:var(--c);position:relative}
.recs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.rec:last-child{border-bottom:0}
.rec .d{font-family:var(--mono);font-size:12px;color:var(--fg2)}
.rec .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rec .t small{color:var(--fg2)}
.none{font-size:13px;color:var(--fg3);padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.spec dt{color:var(--fg2)}
.spec dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px}
details.more summary{cursor:pointer;color:var(--fg2);font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open] summary::before{transform:rotate(45deg)}
.warn{font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--l3) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--l3) 45%,transparent)}

/* forms */
.form{border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface);animation:fadeup .25s var(--ease)}
.form h4{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--fg2);font-weight:500}
.field input,.field select,.field textarea{height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:none}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvpick button{height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color .15s,background .15s}
.lvpick button b{font-family:var(--mono);font-size:20px;line-height:1}
.lvpick button small{font-size:11px;color:var(--fg2)}
.lvpick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.fbtns{display:flex;gap:8px;justify-content:flex-end}
.btn{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--fg3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--l1);border-color:color-mix(in srgb,var(--l1) 45%,transparent)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.err{color:var(--l1);font-size:12.5px}

/* tables & misc for pages */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:border-color .15s,transform .1s}
.kpi:hover{border-color:var(--line-2)}
.kpi:active{transform:scale(.985)}
.kpi>span{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:8px}
.kpi b{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1.1;letter-spacing:-1px}
.kpi small{font-size:12px;color:var(--fg3)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono)}
.tblwrap{overflow-x:auto;margin:0 -18px -18px;padding:0 18px 4px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 4px;border-radius:6px;min-height:36px}
.linkbtn:hover{background:var(--accent-soft)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:86px 26px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.tli:last-child{border-bottom:0}
.tli .d{font-family:var(--mono);font-size:12px;color:var(--fg2);padding-top:3px}
.tli .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg2)}
.tli .ic svg{width:15px;height:15px}
.tli .x{font-size:13.5px;min-width:0}
.tli .x small{display:block;color:var(--fg2);font-size:12.5px}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-open{color:var(--l1);background:color-mix(in srgb,var(--l1) 10%,transparent)}
.st-closed{color:var(--fg2);background:var(--surface-2)}
.st-planned{color:var(--l4);background:color-mix(in srgb,var(--l4) 10%,transparent)}
.st-approved{color:var(--l5);background:color-mix(in srgb,var(--l5) 10%,transparent)}
.st-low{color:#B26B00;background:color-mix(in srgb,var(--l3) 18%,transparent)}
.st-ok{color:var(--l5);background:color-mix(in srgb,var(--l5) 10%,transparent)}
.chart text{fill:var(--fg2);font-family:var(--mono);font-size:11px}
.chart .gl{stroke:var(--line)}
.inpnum{width:84px;height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);text-align:right;padding:0 10px;font-family:var(--mono)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* toast & loading */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);transition:opacity .25s,transform .3s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--scene);color:var(--fg2);z-index:3;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:760px){
  :root{--nav-h:56px}
  .brand span{display:none}
  .legend{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:auto;bottom:calc(var(--shv,380px) + 10px);overflow-x:auto;max-width:calc(100% - 84px)}
  .find{top:10px}
  .legend button{min-width:40px;padding:0 6px}
  .sheet-top{padding:0 10px 8px}
  .sheet-content{padding:4px 10px 12px}
  .tabs button{padding:0 12px}
  .rrow{grid-template-columns:32px 72px 1fr auto}
  .rrow .age{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
