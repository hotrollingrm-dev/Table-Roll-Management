<title>Table Roll Layout 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; floating glass rail (zones) left, toolbar top, detail sheet right/bottom */
:root{
  --bg:#E9ECEF; --scene:#E4E8EC; --floor:#D5DAE0; --grid:#C3CAD2;
  --surface:rgba(255,255,255,.78); --surface-solid:#FFFFFF; --line:rgba(20,30,45,.10);
  --fg:#16202B; --fg2:#566271; --fg3:#8A95A3;
  --accent:#1F6FEB; --accent-ink:#FFFFFF;
  --steel:#9AA4AF; --steel-dark:#5E6873; --frame:#3C4652; --motor:#2F5E8C;
  --zA:#3B6FD8; --zB:#14957C; --zC:#7A5BD0; --zD:#D2691E; --zE:#1C93C4; --zF:#B04A7A;
  --hl:#F2B705;
  --font:"Noto Sans Thai","Thonburi",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px; --shadow:0 8px 30px rgba(16,24,40,.12),0 1px 2px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --scene:#11161B; --floor:#171D24; --grid:#252D36;
  --surface:rgba(22,28,35,.78); --surface-solid:#161C23; --line:rgba(255,255,255,.08);
  --fg:#E8EDF2; --fg2:#9AA6B3; --fg3:#66727F; --accent:#4C8DFF;
  --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --scene:#11161B; --floor:#171D24; --grid:#252D36;
  --surface:rgba(22,28,35,.78); --surface-solid:#161C23; --line:rgba(255,255,255,.08);
  --fg:#E8EDF2; --fg2:#9AA6B3; --fg3:#66727F; --accent:#4C8DFF;
  --steel:#AAB3BD; --steel-dark:#6C7682; --frame:#56616E; --motor:#3F78B0;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{padding:10px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:15px;font-weight:600;letter-spacing:.1px}
.brand span{font-size:12px;color:var(--fg2)}
.spacer{flex:1}
.seg{display:flex;padding:4px;gap:2px}
.seg button,.iconbtn{font:inherit;font-size:13px;color:var(--fg2);background:transparent;border:0;border-radius:8px;padding:0 12px;height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover,.iconbtn:hover{color:var(--fg);background:var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px}
.search input{font:inherit;font-family:var(--mono);font-size:13px;width:120px;height:36px;border:0;background:transparent;color:var(--fg);outline:none}
.search input::placeholder{color:var(--fg3);font-family:var(--font)}
.go{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.go:active{transform:translateY(1px)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* zone rail */
.rail{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(80px + env(safe-area-inset-top,0px));width:300px;padding:8px;z-index:4;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 180px);overflow:auto}
.rail h3{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);padding:8px 10px 6px;margin:0}
.zone{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;border:0;background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.zone:hover{background:var(--line)}
.zone[aria-pressed="true"]{background:var(--surface-solid);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.ztag{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--zc)}
.zone .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.zone .sub{font-size:12px;color:var(--fg2);font-family:var(--mono)}
.zone .ct{font-family:var(--mono);font-size:13px;color:var(--fg2);text-align:right}
.zone .ct small{display:block;font-size:10.5px;color:var(--fg3);font-family:var(--font)}
.totals{display:flex;justify-content:space-between;padding:10px 10px 4px;border-top:1px solid var(--line);margin-top:6px;font-size:12px;color:var(--fg2)}
.totals b{font-family:var(--mono);color:var(--fg);font-weight:500}

/* toggles */
.layers{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:4px;z-index:4;flex-wrap:wrap}
.layers button[aria-pressed="true"]{color:var(--fg)}
.layers button .dot{width:8px;height:8px;border-radius:50%;background:var(--fg3)}
.layers button[aria-pressed="true"] .dot{background:var(--accent)}

/* detail sheet */
.sheet{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(80px + env(safe-area-inset-top,0px));width:340px;z-index:4;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 110px);overflow:auto;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet[data-open="false"]{opacity:0;transform:translateX(12px);pointer-events:none}
.sh-head{display:flex;gap:12px;align-items:flex-start}
.sh-head .ztag{width:44px;height:44px;font-size:18px;border-radius:10px}
.sh-title{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);font-weight:600}
.big{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.1;letter-spacing:-.5px}
.sh-title .nm{font-size:13px;color:var(--fg2);margin-top:2px}
.close{width:36px;height:36px;justify-content:center;padding:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:13px}
dt{color:var(--fg2)}
dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px}
.sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.navrow{display:flex;gap:8px}
.btn2{flex:1;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-solid);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn2:hover{border-color:var(--fg3)}
.btn2:disabled{opacity:.4;cursor:default}
.note{font-size:12px;color:var(--fg3);line-height:1.5}

/* labels in 3D */
.lbl{font-family:var(--font);font-size:12px;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(8px);padding:4px 9px;border-radius:7px;white-space:nowrap;display:flex;align-items:center;gap:7px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lbl i{width:18px;height:18px;border-radius:5px;background:var(--zc);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center}
.lbl.minor{font-weight:500;font-size:11px;color:var(--fg2)}
.lbl.sel{background:var(--hl);color:#1A1400;border-color:transparent;font-family:var(--mono)}
.lbl.rn{font-family:var(--mono);font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px;color:var(--fg2)}
.labels-off .lbl.rn{display:none}

.tip{position:fixed;z-index:6;pointer-events:none;font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;background:var(--fg);color:var(--bg);transform:translate(12px,12px);white-space:nowrap}
.flow{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;padding:8px 12px;font-size:12px;color:var(--fg2);display:flex;gap:8px;align-items:center}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);color:var(--fg2);font-size:14px;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.err{color:#C0392B}
.warn{font-size:12px;line-height:1.5;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,#E0A100 14%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,#E0A100 40%,transparent);margin-top:10px}

@media (max-width:860px){
  .brand span{display:none}
  .rail{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;flex-direction:row;overflow-x:auto;max-height:none;padding:6px}
  .rail h3,.totals,.zone .nm,.zone .ct small{display:none}
  .zone{grid-template-columns:34px auto;width:auto;flex:0 0 auto;padding:6px 10px 6px 6px}
  .zone .ct{display:none}
  .layers{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;overflow-x:auto;flex-wrap:nowrap}
  .flow{display:none}
  .sheet{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:auto;max-height:46%}
  .sheet[data-open="false"]{transform:translateY(12px)}
  .top{flex-wrap:wrap}
  .views{order:3;width:100%;justify-content:space-between}
  .views button{flex:1;justify-content:center;padding:0 6px}
  .search input{width:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage" aria-label="3D layout ของ table roll โซน A ถึง F"></div>
<div class="loading" id="loading">กำลังโหลดโมเดล 3D…</div>

<header class="top">
  <div class="brand glass"><b>Table Roll Layout</b><span>Aluminum Hot Rolling Mill · ไลน์ R-Mill ถึง Shear</span></div>
  <div class="seg glass views" role="group" aria-label="มุมมอง">
    <button data-view="iso" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>ภาพรวม</button>
    <button data-view="top"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16"/></svg>ด้านบน</button>
    <button data-view="side"><svg class="i" viewBox="0 0 24 24"><path d="M3 15h18M6 15v4M18 15v4"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></svg>ด้านข้าง</button>
  </div>
  <div class="spacer"></div>
  <form class="search glass" id="searchForm" role="search">
    <svg class="i" viewBox="0 0 24 24" style="color:var(--fg3)"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
    <label for="q" style="position:absolute;left:-9999px">ค้นหาเลขลูกกลิ้ง</label>
    <input id="q" placeholder="เลขลูก เช่น 152" autocomplete="off" inputmode="text">
    <button class="go" type="submit">ไป</button>
  </form>
</header>

<nav class="rail glass" id="rail" aria-label="โซน">
  <h3>โซนตามทิศทางการไหลของ slab</h3>
</nav>

<div class="layers glass" role="group" aria-label="ชั้นข้อมูล">
  <button class="iconbtn" data-layer="motors" aria-pressed="true"><span class="dot"></span>มอเตอร์</button>
  <button class="iconbtn" data-layer="frames" aria-pressed="true"><span class="dot"></span>โครงสร้าง</button>
  <button class="iconbtn" data-layer="labels" aria-pressed="false"><span class="dot"></span>เลขลูกกลิ้ง</button>
  <button class="iconbtn" data-layer="sim" aria-pressed="false"><span class="dot"></span>จำลอง slab</button>
</div>

<aside class="sheet glass" id="sheet" data-open="false" aria-live="polite"></aside>
<div class="flow glass"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>Material travel A → B → C → Mill → E → F → Shear</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.OrbitControls){ $('#loading').innerHTML='<span class="err">โหลดไลบรารี 3D ไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</span>'; return; }
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Data from GA drawings (dimensions in metres; positions approximate) ---------- */
const TOP=0.765;              // top of table FL+765
const ZONES=[
 {id:'A',name:'Mill Approach Table',th:'โต๊ะลูกกลิ้งนำเข้า',dwg:'LM-B52694',doc:'M826D50019',count:95,first:1,pitch:0.915,dEnd:0.300,dMid:0.262,len:2.50,
  motor:'AC 3.7 kW × 0/325/420 rpm',motorN:'95 ชุด (1 ลูก/1 มอเตอร์)',type:'Double tapered',pitchTxt:'915 mm (ส่วนใหญ่)'},
 {id:'B',name:'Slab Receiving Table',th:'โต๊ะรับ slab',dwg:'LM-B52695',doc:'M826D50020',count:51,first:96,pitch:0.66,dEnd:0.347,dMid:0.300,len:2.54,
  motor:'AC 11 kW × 0/235/300 rpm',motorN:'51 ชุด',type:'Double tapered',pitchTxt:'610 / 767.5 / 915 mm'},
 {id:'C',name:'R-Mill Entry Table',th:'โต๊ะขาเข้า Roughing Mill',dwg:'LM-B52696',doc:'M826D50021',count:17,first:147,pitch:0.50,dEnd:0.347,dMid:0.255,len:2.54,
  motor:'16 × 18.5 kW AC 0/200/255 rpm\n1 × 11 kW AC 0/235/300 rpm',motorN:'17 ชุด (geared motor)',type:'Double tapered · slope 1:25',pitchTxt:'≈500 mm'},
 {id:'D',name:'Roughing Mill Feed Roller Table',th:'ลูกกลิ้งป้อนในแท่น Mill',dwg:'M171B50790',doc:'—',count:8,first:null,pitch:0.455,dEnd:0.417,dMid:0.397,len:2.40,
  motor:'AC 110 kW × 990/1260 rpm · gear i=1/5.444',motorN:'ขาเข้า 4 · ขาออก 4',type:'Slope 1/40 · max Ø417 / std Ø397',pitchTxt:'455 mm',speed:'278 m/min (Ø382)'},
 {id:'E',name:'R-Mill Delivery Table',th:'โต๊ะขาออก Roughing Mill',dwg:'1314020970 1D',doc:'M826D50022',count:18,first:172,pitch:0.50,dEnd:0.367,dMid:0.322,len:2.50,
  motor:'18 × 18.5 kW AC 0/200/255 rpm',motorN:'18 ชุด (geared motor)',type:'Double tapered · slope 1:31',pitchTxt:'500 mm'},
 {id:'F',name:'150mm Shear Entry Table',th:'โต๊ะขาเข้า Shear 150 mm',dwg:'LM-B52700',doc:'M826D50023',count:50,first:190,pitch:0.61,dEnd:0.347,dMid:0.255,len:2.54,
  motor:'AC 11 kW × 0/235/300 rpm',motorN:'สเปกในแบบระบุ 40 ชุด',type:'Double tapered',pitchTxt:'610 mm',
  warn:'แบบ GA แสดงเลขลูก #190–#239 (50 ตำแหน่ง) แต่ตารางสเปกระบุ 40 ลูก / 40 มอเตอร์ ควรตรวจสอบหน้างาน'}
];
const ZCOL={A:'--zA',B:'--zB',C:'--zC',D:'--zD',E:'--zE',F:'--zF'};

// Lay out rolls along x (material travel), z across (−z drive side, +z work side)
const ROLLS=[]; let x=0;
const A=ZONES[0],B=ZONES[1],C=ZONES[2],D=ZONES[3],E=ZONES[4],F=ZONES[5];
for(let i=0;i<A.count;i++){ROLLS.push({z:A,id:'#'+(A.first+i),x});x+=A.pitch;}
A.x0=0;A.x1=x-A.pitch; x+=0.3; B.x0=x;
for(let i=0;i<B.count;i++){ROLLS.push({z:B,id:'#'+(B.first+i),x});x+=B.pitch;}
B.x1=x-B.pitch;
const EDGER=B.x1+2.6; C.x0=EDGER+1.5; x=C.x0;
for(let i=0;i<C.count;i++){ROLLS.push({z:C,id:'#'+(C.first+i),x});x+=C.pitch;}
C.x1=x-C.pitch;
const MILL=C.x1+2.9;
const dPos=[-2.04,-1.585,-1.13,-0.675,0.675,1.13,1.585,2.04];
dPos.forEach((o,i)=>ROLLS.push({z:D,id:i<4?'D-EN'+(4-i):'D-DL'+(i-3),x:MILL+o,side:i<4?'entry':'delivery'}));
D.x0=MILL-2.04;D.x1=MILL+2.04;
E.x0=MILL+2.9;x=E.x0;
for(let i=0;i<E.count;i++){ROLLS.push({z:E,id:'#'+(E.first+i),x});x+=E.pitch;}
E.x1=x-E.pitch; F.x0=E.x1+1.2; x=F.x0;
for(let i=0;i<F.count;i++){ROLLS.push({z:F,id:'#'+(F.first+i),x});x+=F.pitch;}
F.x1=x-F.pitch; let SHEAR=F.x1+0.55;
const LEN=SHEAR+3; const MID=LEN/2;
ROLLS.forEach((r,i)=>{r.i=i;r.x-=MID;});
ZONES.forEach(z=>{z.x0-=MID;z.x1-=MID;});
const millX=MILL-MID, edgerX=EDGER-MID; SHEAR-=MID;

/* ---------- Scene ---------- */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const lr=new THREE.CSS2DRenderer(); lr.domElement.style.cssText='position:absolute;inset:0;pointer-events:none';
stage.appendChild(lr.domElement); stage.classList.add('labels-off');

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,0.1,2000);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.enableDamping=true; ctl.dampingFactor=.08; ctl.maxPolarAngle=Math.PI*0.495; ctl.minDistance=3; ctl.maxDistance=320; ctl.screenSpacePanning=true;

const hemi=new THREE.HemisphereLight(0xffffff,0x8090a0,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9); sun.position.set(-30,60,40); sun.castShadow=true;
sun.shadow.mapSize.set(4096,1024); const sc=sun.shadow.camera; sc.left=-100;sc.right=100;sc.top=20;sc.bottom=-20;sc.near=1;sc.far=200; scene.add(sun); scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xffffff,.25); fill.position.set(40,20,-30); scene.add(fill);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.35,roughness:.55},o));
const mats={};
function themeMats(){
  scene.background=new THREE.Color(css('--scene')).convertSRGBToLinear();
  const set=(k,c,o)=>{ if(!mats[k]) mats[k]=M(c,o); mats[k].color.set(c).convertSRGBToLinear(); if(mats[k].emissive&&k==='hl') mats[k].emissive.set(c).convertSRGBToLinear(); };
  set('floor',css('--floor'),{metalness:0,roughness:1});
  set('steel',css('--steel'),{metalness:.75,roughness:.32});
  set('steelDark',css('--steel-dark'),{metalness:.6,roughness:.45});
  set('frame',css('--frame'),{metalness:.3,roughness:.7});
  set('motor',css('--motor'),{metalness:.3,roughness:.5});
  set('pit',css('--grid'),{metalness:0,roughness:1});
  set('hl',css('--hl'),{metalness:.4,roughness:.35,emissive:new THREE.Color(css('--hl')),emissiveIntensity:.35});
  set('slab',0xC9CDD2,{metalness:.85,roughness:.25});

function rollGeo(z){
  const L=z.len, rE=z.dEnd/2, rM=z.dMid/2, pts=[];
  const n=16;
  pts.push(new THREE.Vector2(0.001,-L/2-0.25));
  pts.push(new THREE.Vector2(0.06,-L/2-0.25));
  pts.push(new THREE.Vector2(0.06,-L/2));
  pts.push(new THREE.Vector2(rE*0.9,-L/2));
  for(let i=0;i<=n;i++){const t=i/n, y=-L/2+t*L, k=Math.abs(t-.5)*2; pts.push(new THREE.Vector2(rM+(rE-rM)*Math.pow(k,1.1),y));}
  pts.push(new THREE.Vector2(rE*0.9,L/2)); pts.push(new THREE.Vector2(0.06,L/2)); pts.push(new THREE.Vector2(0.06,L/2+0.25)); pts.push(new THREE.Vector2(0.001,L/2+0.25));
  const g=new THREE.LatheGeometry(pts,28); g.rotateX(Math.PI/2); return g;
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(fly){const t=Math.min((now-fly.t0)/fly.ms,1),k=ease(t);cam.position.lerpVectors(fly.fp,fly.tp,k);ctl.target.lerpVectors(fly.ft,fly.tt,k);if(t>=1)fly=null;}
  if(layerState.sim){
    slab.position.x+=dt*6; if(slab.position.x>MID+6) slab.position.x=-MID-6;
    const sx=slab.position.x;
    ROLLS.forEach(r=>{ if(Math.abs(r.x-sx)<12) r.mesh.rotation.z-=dt*6/(r.z.dEnd/2); });
  }
  const cd=cam.position.distanceTo(ctl.target); lod.forEach(o=>o.visible=cd<70);
  ROLLS.forEach(r=>r.lbl.visible=cd<40||r===selRoll);
  ctl.update(); renderer.render(scene,cam); lr.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
$('#loading').classList.add('done');
})();
</script>
